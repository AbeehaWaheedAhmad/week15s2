name: wf-ci-development
on: 
  pull-request:
    branches:
      - develop
jobs:
  ci-development-job:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Lint HTML and css
        run: |
          npx htmlhint "**/*.html"
          npx htmlhint "**/*.css"
      - name: Test build Ops
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" 